      background: radial-gradient(circle at center, #111827 0%, #0b1020 70%);

      border-bottom: 1px solid #1f2937;
    }

    .legend {
      margin: 10px 18px;
      color: #9ca3af;
      font-size: 13px;
    }

    .legend span {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>

  <div class="sub">

    const graph = { nodes, links };
    const byId = Object.fromEntries(graph.nodes.map(n => [n.id, n]));

    const width = 1400;
    const height = 860;

    const svg = d3.select("svg");
    const container = svg.append("g");

    svg.call(
      d3.zoom()
        .scaleExtent([0.35, 2.5])
        .on("zoom", (event) => {
          container.attr("transform", event.transform);
        })
    );

    const color = {
      root: "#f97316",
      signal: "#3b82f6",
      algorithm: "#22c55e",
      problem: "#eab308"
    };

    const radius = {
      root: 18,
      signal: 13,
      algorithm: 12,
      problem: 8
    };

    const simulation = d3.forceSimulation(graph.nodes)
      .force("link", d3.forceLink(graph.links).id(d => d.id).distance(75).strength(0.65))
      .force("charge", d3.forceManyBody().strength(-220))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide().radius(d => radius[d.group] + 12));

    const link = container.append("g")
      .selectAll("line")
      .data(graph.links)
      .join("line")
      .attr("stroke", "#4b5563")
      .attr("stroke-opacity", 0.35)
      .attr("stroke-width", 1.15);

    const node = container.append("g")
      .selectAll("g")
      .data(graph.nodes)
      .join("g")
      .call(drag(simulation))
      .on("click", (event, d) => showDetails(d));

    node.append("circle")
      .attr("r", d => radius[d.group] || 8)
      .attr("fill", d => color[d.group] || "#9ca3af")
      .attr("stroke", "#0b1020")
      .attr("stroke-width", 2);

    node.append("text")
      .text(d => d.label)
      .attr("x", 0)
      .attr("y", d => (radius[d.group] || 8) + 13)
      .attr("text-anchor", "middle")
      .attr("font-size", d => d.group === "problem" ? "8px" : "10px")
      .attr("fill", "#e5e7eb")
      .style("pointer-events", "none");

    node.append("title")
      .text(d => [
        d.label,
        d.when ? `WHERE/WHEN: ${d.when}` : "",
        d.how ? `HOW: ${d.how}` : "",
        d.where ? `USED IN: ${d.where}` : ""
      ].filter(Boolean).join("\n"));

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function drag(sim) {
      function dragstarted(event, d) {
        if (!event.active) sim.alphaTarget(0.18).restart();
        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragended(event, d) {
        if (!event.active) sim.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      }

      return d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended);
    }

    function showDetails(d) {
      const result = document.getElementById("result");
      result.innerHTML = `
        <strong>${d.label}</strong><br/>
        <strong>WHERE / WHEN:</strong> ${d.when || "—"}<br/>
        <strong>HOW:</strong> ${d.how || "—"}<br/>
        <strong>USED IN:</strong> ${d.where || "—"}
      `;
    }

    const getId = x => typeof x === "object" ? x.id : x;

    const keywordRules = [
      {
        pattern: /subarray.*sum|prefix|range sum|cumulative/i,
        algos: ["prefix", "hash"],
        reason: "Range accumulation or prefix relation"
      },
      {
        pattern: /substring|window|at most|at least|contiguous|longest valid/i,
        algos: ["window", "hash"],
        reason: "Contiguous segment with a validity constraint"
      },
      {
        pattern: /pair|two sum|triplet|3sum|complement/i,
        algos: ["hash", "twoPointers", "sorting"],
        reason: "Find matching pairs/triplets"
      },
      {
        pattern: /sorted|binary search|first.*last|median.*sorted|insert position/i,
        algos: ["binarySearch"],
        reason: "Ordered search boundary"
      },
      {
        pattern: /minimum.*(speed|capacity|days|threshold|limit)|maximize.*minimum|smallest divisor|koko/i,
        algos: ["binaryAnswer"],
        reason: "Feasibility is monotonic over answer space"
      },
      {
        pattern: /parentheses|decode|expression|nested|brackets/i,
        algos: ["stack"],
        reason: "Nested structure needs delayed resolution"
      },
      {
        pattern: /next greater|next smaller|histogram|rectangle|trap|boundary dominance/i,
        algos: ["monotonicStack"],
        reason: "Next dominating boundary"
      },
      {
        pattern: /top k|kth largest|kth smallest|median stream|merge k/i,
        algos: ["heap"],
        reason: "Dynamic extreme/current best"
      },
      {
        pattern: /shortest path|shortest steps|minimum moves|word ladder|rotting|level order/i,
        algos: ["bfs", "queue"],
        reason: "Layer-by-layer shortest unweighted distance"
      },
      {
        pattern: /island|grid|matrix|flood|region|board/i,
        algos: ["dfs", "bfs", "unionFind"],
        reason: "Grid cells form implicit graph components"
      },
      {
        pattern: /course|prerequisite|dependency|dependencies|order|dag/i,
        algos: ["topological"],
        reason: "Dependencies require DAG ordering"
      },
      {
        pattern: /connected|component|merge accounts|redundant|grouping/i,
        algos: ["unionFind", "dfs", "bfs"],
        reason: "Connectivity/grouping"
      },
      {
        pattern: /interval|meeting|overlap|event|schedule/i,
        algos: ["sorting", "sweep", "heap"],
        reason: "Interval overlap/event processing"
      },
      {
        pattern: /subset|permutation|combination|choose|arrange|partition/i,
        algos: ["backtracking", "bitmask", "dp"],
        reason: "Enumerate or optimize choices"
      },
      {
        pattern: /dp|dynamic programming|count ways|maximize|minimize|longest|minimum cost|optimal/i,
        algos: ["dp", "greedy", "binaryAnswer"],
        reason: "Optimization/counting over states"
      },
      {
        pattern: /greedy|jump game|gas station|boats|task scheduler|local choice/i,
        algos: ["greedy"],
        reason: "Local safe choice"
      },
      {
        pattern: /prefix search|autocomplete|trie|dictionary|word search ii/i,
        algos: ["trie"],
        reason: "Shared prefixes"
      },
      {
        pattern: /range query|range update|mutable|segment tree|binary indexed tree|bit\b/i,
        algos: ["segment", "prefix"],
        reason: "Dynamic range operations"
      },
      {
        pattern: /sql|database|consecutive.*numbers|rank|salary|window function|lag|lead/i,
        algos: ["sql"],
        reason: "Ordered row state/aggregation"
      },
      {
        pattern: /xor|bit|mask|bitmask|parity/i,
        algos: ["bitmask", "prefix"],
        reason: "Compact bit state or prefix XOR"
      },
      {
        pattern: /weighted.*path|network delay|cheapest|minimum effort|dijkstra/i,
        algos: ["dijkstra"],
        reason: "Weighted shortest path"
      },
      {
        pattern: /cache|lru|stream|design|data structure|random/i,
        algos: ["hash", "linkedList", "heap", "trie"],
        reason: "Combine structures for operation constraints"
      },
      {
        pattern: /linked list|reverse list|merge list|swap nodes/i,
        algos: ["linkedList"],
        reason: "Pointer rewiring"
      }
    ];

    function applySearch() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const matchedAlgorithms = new Set();
      const matchedProblems = new Set();
      const reasons = new Set();

      if (!q) {
        clearSearch();
        return;
      }

      keywordRules.forEach(rule => {
        if (rule.pattern.test(q)) {
          rule.algos.forEach(a => matchedAlgorithms.add(a));
          reasons.add(rule.reason);
        }
      });

      graph.nodes.forEach(n => {
        if (n.group === "algorithm" && n.label.toLowerCase().includes(q)) {
          matchedAlgorithms.add(n.id);
          reasons.add("Direct algorithm match");
        }

        if (n.group === "problem" && n.label.toLowerCase().includes(q)) {
          matchedProblems.add(n.id);
          reasons.add("Direct problem match");
        }
      });

      graph.links.forEach(l => {
        const s = getId(l.source);
        const t = getId(l.target);

        if (matchedProblems.has(t) && byId[s]?.group === "algorithm") {
          matchedAlgorithms.add(s);
        }
      });

      graph.links.forEach(l => {
        const s = getId(l.source);
        const t = getId(l.target);

        if (matchedAlgorithms.has(s) && byId[t]?.group === "problem") {
          matchedProblems.add(t);
        }
      });

      const matchedNodes = new Set(["root"]);
      matchedAlgorithms.forEach(id => matchedNodes.add(id));
      matchedProblems.forEach(id => matchedNodes.add(id));

      graph.links.forEach(l => {
        const s = getId(l.source);
        const t = getId(l.target);

        if (matchedAlgorithms.has(t) && byId[s]?.group === "signal") {
          matchedNodes.add(s);
        }
      });

      node.attr("opacity", d => matchedNodes.has(d.id) ? 1 : 0.12);
      link.attr("stroke-opacity", l => {
        const s = l.source.id;
        const t = l.target.id;
        return matchedNodes.has(s) && matchedNodes.has(t) ? 0.9 : 0.05;
      });

      const result = document.getElementById("result");

      if (matchedAlgorithms.size === 0) {
        result.innerHTML = `
          No direct match. Try keywords like:<br/>
          <em>subarray sum, substring, top k, prerequisites, intervals, shortest path, bitmask, sql, cache, monotonic stack</em>
        `;
      } else {
        const algoNames = [...matchedAlgorithms].map(id => byId[id].label).join(", ");
        result.innerHTML = `
          <strong>Recommended algorithms:</strong> ${algoNames}<br/>
          <strong>Why:</strong> ${[...reasons].join("; ")}<br/>
          <strong>Example problems highlighted:</strong> ${matchedProblems.size || 0}
        `;
      }
    }

    function clearSearch() {
      document.getElementById("search").value = "";
      node.attr("opacity", 1);
      link.attr("stroke-opacity", 0.35);
      document.getElementById("result").textContent = "Click a node or search a problem pattern.";
    }
  </script>
</body>
</html>
