        <div class="anim a5" style="margin-top:26px">
          <div class="editor">
            <div class="e-bar"><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="fname">forever.c</span></div>
            <pre class="code">${hl('while (curious) {\n    write_code();\n    make_mistakes();\n    get_better();   // forever\n}')}</pre>
          </div>
          <div class="terminal" style="margin-top:14px">
            <div class="t-bar"><i data-lucide="terminal"></i><span>OUTPUT</span></div>
            <pre class="out"><span class="txt"></span><span class="cur"></span></pre>
          </div>
        </div>
      </div>`;
                sec._outText = 'see you in the terminal';
            }
            else if (s.type === 'divider') {
                sec.classList.add('divider');
                const meta = CHAPTERS[s.ch - 1];
                const topics = S.filter(x => x.ch === s.ch).map(x => x.t);
                sec.innerHTML = `
      <div class="ghost big anim a0">${pad2(s.ch)}</div>
      <div class="d-wrap">
        <div class="kicker anim a1">Chapter ${pad2(s.ch)} of ${pad2(CHAPTERS.length)}</div>
        <h1 class="anim a2">${meta.t}</h1>
        <p class="d-tag anim a3">${meta.d}</p>
        <div class="d-topics anim a4">${topics.map(t => `<b>·</b> ${t}`).join(' ')}</div>
        <div class="d-count anim a5">${topics.length} pages ahead</div>
      </div>`;
            }
            else {
                sec.innerHTML = `
      <div class="ghost anim a0">${pad3(i + 1)}</div>
      <div class="left">
        <div class="kicker anim a1">Ch ${pad2(s.ch)} · ${CHAPTERS[s.ch - 1].t}</div>
        <h2 class="anim a2">${s.t}</h2>
        <p class="sub anim a3">${s.s}</p>
        <div class="analogy anim a4">
          <div class="a-head"><span class="a-ic"><i data-lucide="${s.i}"></i></span><span>Analogy</span></div>
          <p>${s.a}</p>
        </div>
      </div>
      <div class="right anim a5">
        <div class="editor">
          <div class="e-bar"><span class="d d1"></span><span class="d d2"></span><span class="d d3"></span><span class="fname">${s.f}</span></div>
          <pre class="code">${hl(s.c)}</pre>
        </div>
        <div class="terminal">
          <div class="t-bar"><i data-lucide="terminal"></i><span>Output</span></div>
          <pre class="out"><span class="txt"></span><span class="cur"></span></pre>
        </div>
      </div>`;
                sec._outText = s.o;
            }
            deck.appendChild(sec);
        });
        lucide.createIcons();

        /* ===== typewriter output ===== */
        function typeOut(slide) {
            slide.querySelectorAll('pre.out').forEach(pre => {
                const full = slide._outText || '';
                if (pre._tw) clearInterval(pre._tw);
                const span = pre.querySelector('.txt');
                span.textContent = '';
                let i = 0;
                const chunk = Math.max(1, Math.ceil(full.length / 60));
                pre._tw = setInterval(() => {
                    if (slide !== els[idx]) { clearInterval(pre._tw); span.textContent = full; return; }
                    if (i >= full.length) { clearInterval(pre._tw); return; }
                    i = Math.min(full.length, i + chunk);
                    span.textContent = full.slice(0, i);
                }, 26);
            });
        }

        /* ===== TOC ===== */
        const toc = document.getElementById('toc');
        const tocGrid = document.getElementById('tocGrid');
        const groups = [];
        PAGES.forEach((s, i) => {
            const key = s.type === 'divider' ? 'div' + s.ch : (s.type || s.ch);
            const label = s.type === 'divider' ? `Ch ${pad2(s.ch)} — ${CHAPTERS[s.ch - 1].t}`
                : s.type === 'title' ? 'Cover' : s.type === 'end' ? 'Epilogue' : null;
            let g = groups[groups.length - 1];
            if (!g || g.key !== key) { g = { key, label, divI: s.type === 'divider' ? i : null, items: [] }; groups.push(g); }
            if (!s.type) g.items.push({ i, t: s.t });
        });
        groups.forEach(g => {
            const div = document.createElement('section');
            div.className = 'toc-ch';
            div.innerHTML = `<h3 data-i="${g.divI}">${g.label}<span>${g.items.length} pg</span></h3>` +
                g.items.map(it => `<button class="item" data-i="${it.i}"><span class="n">${pad3(it.i + 1)}</span>${it.t}</button>`).join('');
            tocGrid.appendChild(div);
        });
        tocGrid.addEventListener('click', e => {
            const t = e.target.closest('[data-i]');
            if (!t) return;
            go(+t.dataset.i);
            closeToc();
        });
        function openToc() {
            toc.classList.add('open');
            toc.querySelectorAll('.item.cur').forEach(b => b.classList.remove('cur'));
            const cur = toc.querySelector(`.item[data-i="${idx}"]`);
            if (cur) { cur.classList.add('cur'); cur.scrollIntoView({ block: 'center' }); }
        }
        function closeToc() { toc.classList.remove('open'); }
        document.getElementById('contents').onclick = openToc;
        document.getElementById('tocClose').onclick = closeToc;

        /* ===== navigation ===== */
        const els = [...deck.children];
        const total = els.length;
        const counter = document.getElementById('counter');
        const chapter = document.getElementById('chapter');
        const fill = document.getElementById('fill');
        const track = document.getElementById('track');
        PAGES.forEach((s, i) => {
            if (s.type === 'divider' && (i === 0 || PAGES[i - 1].type === 'divider')) { }
            if (s.type === 'divider') {
                const n = document.createElement('i');
                n.style.left = (i / total * 100) + '%';
                track.appendChild(n);
            }
        });
        let idx = 0, leaveTimer;
        function chLabel(s) {
            if (s.type === 'title') return 'Cover';
            if (s.type === 'end') return 'Epilogue';
            if (s.type === 'divider') return `Ch ${pad2(s.ch)} · ${CHAPTERS[s.ch - 1].t}`;
            return `Ch ${pad2(s.ch)} · ${CHAPTERS[s.ch - 1].t}`;
        }
        function updateUI() {
            counter.textContent = `§ ${pad3(idx + 1)} / ${pad3(total)}`;
            chapter.textContent = chLabel(PAGES[idx]);
            fill.style.width = ((idx + 1) / total * 100) + '%';
        }
        function go(n) {
            n = Math.max(0, Math.min(total - 1, n));
            if (n === idx) return;
            clearTimeout(leaveTimer);
            const old = els[idx];
            old.classList.remove('active'); old.classList.add('leaving');
            leaveTimer = setTimeout(() => old.classList.remove('leaving'), 400);
            idx = n;
            els[idx].classList.add('active');
            typeOut(els[idx]);
            updateUI();
        }
        els[0].classList.add('active');
        typeOut(els[0]);
        updateUI();
        document.getElementById('next').onclick = () => go(idx + 1);
        document.getElementById('prev').onclick = () => go(idx - 1);
        document.addEventListener('keydown', e => {
            if (e.key === 'o' || e.key === 'O') { toc.classList.contains('open') ? closeToc() : openToc(); return; }
            if (e.key === 'Escape') { closeToc(); return; }
            if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); go(idx + 1); }
            if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(idx - 1); }
            if (e.key === 'Home') go(0);
            if (e.key === 'End') go(total - 1);
        });
        let tx = null;
        document.addEventListener('touchstart', e => tx = e.touches[0].clientX, { passive: true });
        document.addEventListener('touchend', e => {
            if (tx === null) return;
            const dx = e.changedTouches[0].clientX - tx;
            if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
            tx = null;
        }, { passive: true });
    </script>
</body>

</html>
